<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Profit Maximization</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&display=swap">
<style>
/* ------------------------------------------------------------------
   CUNEF brand: Naranja 166C #ff5700, Azul 2118C #1a1f6c,
   Beige 7527C #d6d1c4, Beige Claro #f0ece8.  Type: Taviraj display,
   Arial body (the manual's substitute for Aeonik).
   Colour rule: one hue, one meaning, on every plate.
     AZUL    = the buyers' side   (D, MR, the price a firm faces, CS)
     NARANJA = the firm's costs   (MC, AC, AVC, S, PS)
     BLACK   = the outcome        (optimum, equilibrium, profit, DWL)
   ------------------------------------------------------------------ */
:root{
  --display:"Taviraj",Georgia,"Times New Roman",serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;

  --ground:#f0ece8;
  --panel:#ffffff;
  --panel-2:#f7f4f1;
  --beige:#d6d1c4;
  --ink:#000000;
  --ink-2:#4a4741;
  --ink-3:#7d786f;
  --orange:#ff5700;
  --azul:#1a1f6c;
  --azul-soft:#d2e0f3;

  /* semantic aliases used by the figures */
  --demand:var(--azul);
  --supply:var(--orange);
  --mr:var(--azul);
  --cost-2:#ff9a5c;      /* a tint of Naranja: AC against MC */
  --cost-3:#c98a63;      /* muted Naranja: AVC */
  --dwl:var(--ink);
  --good:var(--ink);

  --fill-cs:rgba(26,31,108,.13);
  --fill-ps:rgba(255,87,0,.13);
  --fill-ink:rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0b0b0c; --panel:#16161a; --panel-2:#1d1d21;
    --beige:#3b362c; --ink:#ffffff; --ink-2:#c8c4bc; --ink-3:#8e8a82;
    --orange:#ff7a45; --azul:#93a4ea; --azul-soft:#22305e;
    --cost-2:#ffb98f; --cost-3:#d9a583;
    --fill-cs:rgba(147,164,234,.17);
    --fill-ps:rgba(255,122,69,.15);
    --fill-ink:rgba(255,255,255,.10);
  }
}
:root[data-theme="dark"]{
  --ground:#0b0b0c; --panel:#16161a; --panel-2:#1d1d21;
  --beige:#3b362c; --ink:#ffffff; --ink-2:#c8c4bc; --ink-3:#8e8a82;
  --orange:#ff7a45; --azul:#93a4ea; --azul-soft:#22305e;
  --cost-2:#ffb98f; --cost-3:#d9a583;
  --fill-cs:rgba(147,164,234,.17);
  --fill-ps:rgba(255,122,69,.15);
  --fill-ink:rgba(255,255,255,.10);
}

.wrap{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

.rail{border-right:1px solid var(--beige);background:var(--panel);padding-block:22px;padding-left:18px;padding-right:14px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}

.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--beige);border:1px solid var(--beige);margin:0 0 12px}

.verdict{font-size:14px;padding:10px 14px;background:var(--panel);border-left:3px solid var(--orange);margin:0 0 12px}

table{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 12px;background:var(--panel)}
th,td{text-align:right;padding:8px 11px;border-bottom:1px solid var(--beige)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}

tbody tr:last-child td{border-bottom:0;font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--beige)}
td.win{color:var(--azul);font-weight:700}

.pager{display:flex;gap:10px;align-items:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--beige)}
.pager .sp{flex:1}

@media (max-width:960px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--beige);padding-right:18px}
  .rail ol{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<nav class="rail" aria-label="Plates">
  <p class="brand">Profit Maximization<span>Microeconomics</span></p>
  <ol id="rail"></ol>
  <div class="key"><b>Reading the figures</b>
    <i class="a">Blue</i> — the buyers' side<br>
    <i class="o">Orange</i> — the firm's costs<br>
    <i class="k">Black</i> — the outcome
  </div>
</nav>

<main>
  <div class="topbar">
    <button class="railbtn" id="railToggle" type="button" aria-expanded="true">‹ Hide plates</button>
    <span class="sp"></span>
    <button class="themebtn" id="theme" type="button">Theme</button>
  </div>

  </div>

</div>

<script>
"use strict";

/* ============================================================
   1. Model constants and helper math
   ============================================================ */

// Plate 1: profit-maximisation example.  TC(q) = F + cq + (e/2)q^2
const P1 = {F:100, c:10, e:1, a:100, b:1};
const p1_TC  = q => P1.F + P1.c*q + P1.e/2*q*q;
const p1_MC  = q => P1.c + P1.e*q;
const p1_VC  = q => P1.c*q + P1.e/2*q*q;

// Competitive firm (Plates 6-10):  TC(q) = F + aq - bq^2 + gq^3
const FIRM = {F:50, a:40, b:12, g:1.5};
const MC   = q => FIRM.a - 2*FIRM.b*q + 3*FIRM.g*q*q;
const AVC  = q => FIRM.a - FIRM.b*q + FIRM.g*q*q;
const VC   = q => FIRM.a*q - FIRM.b*q*q + FIRM.g*q*q*q;
const TC   = q => FIRM.F + VC(q);
const AC   = q => q<=0 ? Infinity : TC(q)/q;

// min AVC (= short-run shut-down price) has a closed form for this cubic
const Q_MINAVC = FIRM.b/(2*FIRM.g);            // 4
const P_SHUT   = AVC(Q_MINAVC);                // 16
// min AC found numerically once
const Q_MINAC = (function(){
  let lo=1, hi=8;
  for(let i=0;i<80;i++){const m1=lo+(hi-lo)/3, m2=hi-(hi-lo)/3; if(AC(m1)<AC(m2)) hi=m2; else lo=m1;}
  return (lo+hi)/2;
})();
const P_LR = AC(Q_MINAC);                      // long-run competitive price

// individual short-run supply: larger root of MC(q)=p, only if p >= min AVC
function supply_i(p){
  if(p < P_SHUT) return 0;
  const disc = 4*FIRM.b*FIRM.b - 12*FIRM.g*(FIRM.a-p);
  if(disc < 0) return 0;
  return (2*FIRM.b + Math.sqrt(disc))/(6*FIRM.g);
}

// Market (Plates 8-10): inverse demand P = A - B*Q
const MKT = {A:100, B:0.5};

function marketEq(N, A, B){
  const D = P => Math.max(0,(A-P)/B);
  let lo=0.01, hi=A;
  for(let i=0;i<70;i++){
    const m=(lo+hi)/2;
    if(N*supply_i(m) - D(m) > 0) hi=m; else lo=m;
  }
  const P=(lo+hi)/2, q=supply_i(P), Q=N*q;
  const psi = P*q - VC(q), pi = psi - FIRM.F;
  return {P, q, Q, psi, pi, CS:0.5*Math.max(0,A-P)*Math.max(0,(A-P)/B), PS:N*psi};
}

const fmt = (x,d=1)=>{
  if(!Number.isFinite(x)) return "—";
  return x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
};
const eur = (x,d=0)=>"€"+fmt(x,d);

/* ============================================================
   2. Tiny SVG plotting kit
   ============================================================ */
// x_1 and x^2 become real sub- and superscripts inside SVG text
function mt(s){
  return String(s)
    .replace(/([A-Za-z0-9*)])\^([A-Za-z0-9*+-]+)/g,(m,a,b)=>a+'<tspan baseline-shift="super" font-size="72%">'+b+'</tspan>')
    .replace(/([A-Za-z0-9*)])_([A-Za-z0-9*]+)/g,(m,a,b)=>a+'<tspan baseline-shift="-22%" font-size="72%">'+b+'</tspan>');
}

let __uid = 0;

function Plot(opt){
  const o = Object.assign({
    w:560,h:400,x0:0,x1:10,y0:0,y1:10,
    padL:54,padR:74,padT:36,padB:46,
    xlab:"q", ylab:"€", aria:""
  }, opt);
  const u = "u"+(++__uid);
  const iw = o.w-o.padL-o.padR, ih = o.h-o.padT-o.padB;
  const X = v => o.padL + (v-o.x0)/(o.x1-o.x0)*iw;
  const Y = v => o.padT + ih - (v-o.y0)/(o.y1-o.y0)*ih;
  const back = [], body = [], front = [];

  const P = {X,Y,o,u,
    axes(xt,yt){
      const L=[];
      (yt||[]).forEach(t=>L.push(`<line class="grid" x1="${X(o.x0)}" y1="${Y(t.v)}" x2="${X(o.x1)}" y2="${Y(t.v)}"/>`));
      (xt||[]).forEach(t=>L.push(`<line class="grid" x1="${X(t.v)}" y1="${Y(o.y0)}" x2="${X(t.v)}" y2="${o.padT}"/>`));
      L.push(`<line class="axis" x1="${o.padL}" y1="${Y(o.y0)}" x2="${o.padL+iw+16}" y2="${Y(o.y0)}" marker-end="url(#${u}-arw)"/>`);
      L.push(`<line class="axis" x1="${o.padL}" y1="${Y(o.y0)}" x2="${o.padL}" y2="${o.padT-16}" marker-end="url(#${u}-arw)"/>`);
      (xt||[]).forEach(t=>L.push(`<text class="tick" x="${X(t.v)}" y="${Y(o.y0)+16}" text-anchor="middle">${mt(t.t!==undefined?t.t:t.v)}</text>`));
      (yt||[]).forEach(t=>L.push(`<text class="tick" x="${o.padL-8}" y="${Y(t.v)+4}" text-anchor="end">${mt(t.t!==undefined?t.t:t.v)}</text>`));
      L.push(`<text class="axlab" x="${o.padL+iw+14}" y="${Y(o.y0)+20}" text-anchor="start">${mt(o.xlab)}</text>`);
      L.push(`<text class="axlab" x="${o.padL-8}" y="${o.padT-20}" text-anchor="end">${mt(o.ylab)}</text>`);
      back.push(L.join(""));
      return P;
    },
    curve(f,c){
      c = c||{};
      const from = c.from!==undefined?c.from:o.x0, to = c.to!==undefined?c.to:o.x1, n = c.n||160;
      const pts=[];
      for(let i=0;i<=n;i++){
        const x = from+(to-from)*i/n, y = f(x);
        if(Number.isFinite(y)) pts.push(X(x).toFixed(1)+","+Y(y).toFixed(1));
      }
      if(pts.length>1){
        body.push(`<g clip-path="url(#${u}-clip)"><polyline class="curve ${c.cls||"c-ink"}" points="${pts.join(" ")}" stroke-width="${c.w||2.2}"${c.dash?` stroke-dasharray="${c.dash}"`:""}/></g>`);
      }
      if(c.label!==undefined){
        const lx = c.labelAt!==undefined?c.labelAt:to;
        const ly = c.labelY!==undefined?c.labelY:f(lx);
        front.push(`<text class="clab ${c.tcls||"t-ink"}" x="${X(lx)+(c.ldx!==undefined?c.ldx:8)}" y="${Y(ly)+(c.ldy!==undefined?c.ldy:4)}" text-anchor="${c.lanchor||"start"}">${mt(c.label)}</text>`);
      }
      return P;
    },
    line(pts,c){
      c=c||{};
      const s = pts.filter(pt=>Number.isFinite(pt[0])&&Number.isFinite(pt[1]))
                   .map(pt=>X(pt[0]).toFixed(1)+","+Y(pt[1]).toFixed(1)).join(" ");
      body.push(`<g clip-path="url(#${u}-clip)"><polyline class="curve ${c.cls||"c-ink"}" points="${s}" stroke-width="${c.w||2.2}"${c.dash?` stroke-dasharray="${c.dash}"`:""}/></g>`);
      return P;
    },
    poly(pts,c){
      c=c||{};
      const s = pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
      body.push(`<g clip-path="url(#${u}-clip)"><polygon class="${c.cls||"f-cs"}" points="${s}" ${c.stroke?`stroke="${c.stroke}" stroke-width="1"`:'stroke="none"'}/>${c.hatch?`<polygon points="${s}" fill="url(#${u}-hatch)" stroke="none"/>`:""}</g>`);
      return P;
    },
    seg(x1,y1,x2,y2,c){
      c=c||{};
      body.push(`<g clip-path="url(#${u}-clip)"><line class="${c.cls||"guide"}" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke-width="${c.w||1}"${c.dash?` stroke-dasharray="${c.dash}"`:""}/></g>`);
      return P;
    },
    dot(x,y,c){
      c=c||{};
      front.push(`<circle class="dot" cx="${X(x)}" cy="${Y(y)}" r="${c.r||4}" fill="${c.fill||"var(--ink)"}"/>`);
      if(c.label) front.push(`<text class="big" x="${X(x)+(c.ldx||8)}" y="${Y(y)+(c.ldy||-8)}" text-anchor="${c.anchor||"start"}">${mt(c.label)}</text>`);
      return P;
    },
    txt(x,y,s,c){
      c=c||{};
      front.push(`<text class="${c.cls||"anno"}" x="${X(x)+(c.dx||0)}" y="${Y(y)+(c.dy||0)}" text-anchor="${c.anchor||"middle"}">${mt(s)}</text>`);
      return P;
    },
    px(s){front.push(s);return P;},
    svg(){
      const defs = `<defs>
        <marker id="${u}-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="arw" d="M0,1.5 L9,5 L0,8.5 z"/></marker>
        <clipPath id="${u}-clip"><rect x="${o.padL-1}" y="${o.padT-8}" width="${iw+10}" height="${ih+9}"/></clipPath>
        <pattern id="${u}-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatchline" x1="0" y1="0" x2="0" y2="7"/></pattern>
      </defs>`;
      return `<svg class="fig" viewBox="0 0 ${o.w} ${o.h}" role="img" aria-label="${o.aria}">${defs}${back.join("")}${body.join("")}${front.join("")}</svg>`;
    }
  };
  return P;
}

function ticks(lo,hi,step,dec){
  const out=[];
  for(let v=lo; v<=hi+1e-9; v+=step) out.push({v:+v.toFixed(6), t:fmt(v,dec||0)});
  return out;
}
// nice round tick marks between lo and hi, roughly n of them
const NICE = [1,2,2.5,5,10,20,25,50,100,200,250,500,1000];
function autoTicks(lo,hi,n){
  const raw = (hi-lo)/(n||5);
  let step = NICE[NICE.length-1];
  for(const s of NICE){ if(s>=raw){ step=s; break; } }
  const dec = step<1 ? 1 : 0;
  const out=[];
  const start = Math.ceil(lo/step)*step;
  for(let v=start; v<=hi+1e-9; v+=step) out.push({v:+v.toFixed(6), t:fmt(v,dec)});
  return out;
}
function fig(svg,capTitle,capText){
  return `<figure>${svg}<figcaption><b>${capTitle}</b>${capText}</figcaption></figure>`;
}
